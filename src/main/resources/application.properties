spring.application.name=marketatlas-platform

#spring.datasource.url=jdbc:postgresql://localhost:5432/marketatlas
#spring.datasource.username=postgres

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/marketatlas}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=true

twelvedata.connect-timeout=5s
twelvedata.response-timeout=10s

twelvedata.base-url=https://api.twelvedata.com

spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

marketatlas.security.admin-username=${ADMIN_USERNAME:admin}
marketatlas.security.admin-password=${ADMIN_PASSWORD:}
