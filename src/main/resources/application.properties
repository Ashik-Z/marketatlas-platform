spring.application.name=marketatlas-platform
spring.datasource.url=jdbc:postgresql://localhost:5432/marketatlas
spring.datasource.username=postgres
spring.datasource.password=${MARKETATLAS_DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

twelvedata.base-url=https://api.twelvedata.com
twelvedata.api-key=${TWELVE_DATA_API_KEY}

