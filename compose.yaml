services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: marketatlas
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in your .env file}
    ports:
      - "5432:5432"
    volumes:
      - marketatlas-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d marketatlas"]
      interval: 5s
      timeout: 5s
      retries: 10

  marketatlas:
    build: .
    image: marketatlas:local
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/marketatlas
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in your .env file}
      TWELVEDATA_API_KEY: ${TWELVEDATA_API_KEY:?Set TWELVEDATA_API_KEY in your .env file}
      FRED_API_KEY: ${FRED_API_KEY:?Set FRED_API_KEY in your .env file}

volumes:
  marketatlas-data:
